name: Deploy to Production

on:
  repository_dispatch:
    types: [deploy-auth, deploy-frontend, deploy-main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Выводим информацию о сервисе
        run: |
          echo "Получен сигнал деплоя для сервиса: ${{ github.event.client_payload.service }}"
          echo "SHA коммита: ${{ github.event.client_payload.sha }}"

      - name: Подключаемся к серверу и деплоим
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_PORT }}  # опционально, по умолчанию 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: true
          script: |
            # cd flashmind-deploy  # укажите реальный путь на сервере
            # git pull origin main      # обновляем конфиги (если изменились)

            # # Создаём/обновляем .env.prod из секрета (рекомендуется)
            # echo "${{ secrets.AUTH_SERVICE_ENV_PROD }}" > .env.auth


            # docker compose pull ${{ github.event.client_payload.service }}
            # docker compose up -d ${{ github.event.client_payload.service }}
            # docker system prune -f --filter "until=48h"


            set -e
  
            # Переходим в домашнюю папку
            cd ~
            
            # Проверяем, существует ли папка flashmind-deploy
            if [ ! -d "flashmind-deploy" ]; then
              echo "✅ Папка flashmind-deploy не найдена, клонируем репозиторий..."
              
              # Клонируем репозиторий на сервер
              git clone https://github.com/lazyfoxx/flashmind-deploy.git flashmind-deploy
              
              # Переходим в клонированную папку
              cd flashmind-deploy
            else
              echo "✅ Папка flashmind-deploy найдена, обновляем репозиторий..."
              
              # Если папка уже есть, обновляем с репозитория
              cd flashmind-deploy
              git pull origin main
            fi

            echo "✅ Текущая директория: $(pwd)"
            echo "✅ Текущий пользователь: $(whoami)"
            echo "✅ Git статус перед обновлением:"
            git status --porcelain -b || echo "Git не найден в этой папке"
            
            # Создаём .env.auth правильно (многострочный секрет)
            # cat > .env.auth << 'EOF'
            # ${{ secrets.AUTH_ENV_PROD }}
            # EOF

            - name: Create .env.auth from secret
            run: |
            printf '%s\n' "${{ secrets.AUTH_ENV_PROD }}" > .env.auth
            echo "✅ .env.auth создан, размер: $(wc -c < .env.auth) байт"
            cat .env.auth | sed 's/=.*/=***/g'   # скрываем значения для лога
            
            echo "✅ .env.auth создан"
            
            # Деплой
            docker compose pull auth
            docker compose up -d auth
            
            echo "✅ Деплой auth завершён"
            docker compose ps
            docker compose logs --tail=20 auth


